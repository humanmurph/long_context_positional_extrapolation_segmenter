[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanmurph-long_context_positional_extrapolation_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对Agent 应用开发工程师·长上下文的位置编码外推相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "humanmurph" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://humanmurph.github.io"
Repository = "https://github.com/humanmurph/long_context_positional_extrapolation_segmenter"
Issues = "https://github.com/humanmurph/long_context_positional_extrapolation_segmenter/issues"

[project.scripts]
long_context_positional_extrapolation_segmenter = "long_context_positional_extrapolation_segmenter:main"

[tool.setuptools]
py-modules = ["long_context_positional_extrapolation_segmenter"]
